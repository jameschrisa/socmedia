# Render Blueprint: creates the Pulse API as a Docker web service with a persistent disk.
# In Render: New → Blueprint → pick this repo. Set the secret env vars when prompted.
services:
  - type: web
    name: suprstar-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: suprstar-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATA_DIR
        value: /data
      - key: SCHEDULER_INTERVAL_MS
        value: "30000"
      - key: SECRET_KEY
        generateValue: true
      - key: CLIENT_URL
        value: https://socmedia-eight.vercel.app
      - key: PUBLIC_BASE_URL
        sync: false   # set to this service's public URL after the first deploy, e.g. https://pulse-api.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      # Backups (see docs/API.md "Backups"). Local archives always run; these only add offsite copies.
      - key: BACKUP_ENABLED
        value: "true"
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
      - key: BACKUP_KEEP
        value: "7"
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false   # set for Cloudflare R2 / Backblaze B2; leave unset for real AWS S3
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_PREFIX
        sync: false
